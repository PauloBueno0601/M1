<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício do Alien</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style> body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; } </style>
</head>

<body>
    <script>
        // Aqui defini a altura e largura do jogo
        const larguraJogo = 700;
        const alturaJogo = 850;

        // Criei um objeto de configuração para o jogo.
        const config = {
            type: Phaser.AUTO,
            width: larguraJogo,
            height: alturaJogo,

            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                    debug: false 
                }
            },

            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        // Cria o jogo com a configuração dada anteriormente.
        const game = new Phaser.Game(config);

        // Declarei as variáveis do jogo
        var alien;
        var teclado;
        var fogo;
        var plataforma;
        var moeda;
        var pontuacao = 0;
        var placar;

        var obstaculos = [];  // Adicionei lista para armazenar os obstáculos

        // Carrega as imagens
        function preload() {
            this.load.image('background', 'assets/bg.png');
            this.load.image('player', 'assets/alienigena.png');
            this.load.image('turbo_nave', 'assets/turbo.png');
            this.load.image('plataforma_tijolo', 'assets/tijolos.png');
            this.load.image('moeda', 'assets/moeda.png');
            this.load.image('obstaculo', 'assets/tijolo.png');  
        }

        function create() {
            // Adiciona o fundo do jogo
            this.add.image(larguraJogo / 2, alturaJogo / 2, 'background');

            // Fogo do modo turbo
            fogo = this.add.sprite(0, 0, 'turbo_nave');
            fogo.setVisible(false);

            // Criando o alienígena
            alien = this.physics.add.sprite(larguraJogo / 100, 0, 'player');
            alien.setCollideWorldBounds(true);
            teclado = this.input.keyboard.createCursorKeys();

            // Adiciona a plataforma de tijolos 
            plataforma = this.physics.add.staticImage(larguraJogo / 2, alturaJogo / 1.3, 'plataforma_tijolo');
            this.physics.add.collider(alien, plataforma); // Colisão entre alien e plataforma

            // Adicionando a moeda
            moeda = this.physics.add.sprite(larguraJogo / 2, 0, 'moeda');
            moeda.setCollideWorldBounds(true);
            moeda.setBounce(0.7);
            this.physics.add.collider(moeda, plataforma); // Colisão entre moeda e plataforma

            // criando o placar de pontos
            placar = this.add.text(80, 150, 'Moedas:' + pontuacao, { fontSize: '45px', fill: '#495613' });

            // Quando o alienígena encostar na moeda
            this.physics.add.overlap(alien, moeda, coletarMoeda, null, this);

            // Adicionando mais obstáculos em posições fixas
            criarObstaculos(this);
        }

        // Fazendo uma função para criar obstáculos
        function criarObstaculos(scene) {
            // Definindo posições fixas para os obstáculos
            const posicoesObstaculos = [
                { x: 100, y: 450 },
                { x: 500, y: 500 },
                { x: 600, y: 300 }
            ];

            posicoesObstaculos.forEach(pos => {
                var obstaculo = scene.physics.add.staticImage(pos.x, pos.y, 'obstaculo');
                obstaculo.setImmovable(true);
                obstaculos.push(obstaculo);

                // Colisão entre alien e obstáculo
                scene.physics.add.collider(alien, obstaculo);
                // Colisão entre moeda e obstáculo
                scene.physics.add.collider(moeda, obstaculo);
            });
        }

        // Função para coletar moeda
        function coletarMoeda(alien, moeda) {
            moeda.disableBody(true, true);
            pontuacao += 1;
            placar.setText('Moedas:' + pontuacao);

            // troca a posição da nova moeda que cai 
            setTimeout(() => {
                moeda.enableBody(true, Phaser.Math.RND.between(50, larguraJogo - 50), 0, true, true);
            }, 1000);
        }

        function update() {
            // Aqui eu fiz os movimentos do alien
            if (teclado.left.isDown) {
                alien.setVelocityX(-150);
            } else if (teclado.right.isDown) {
                alien.setVelocityX(150);
            } else {
                alien.setVelocityX(0);
            }

            if (teclado.up.isDown) {   //adicionando o turbo ao alien quando usar as teclas
                alien.setVelocityY(-150);
                ativarTurbo();
            } else {
                semTurbo();
            }

            // Atualiza a posição do fogo em relação ao alienígena
            fogo.setPosition(alien.x, alien.y + alien.height / 2);
        }

        function ativarTurbo() { //Define o fogo como uma função para ativar o turbo
            fogo.setVisible(true);
        }

        function semTurbo() { //Define o fogo como uma função para desativar o turbo
            fogo.setVisible(false);
        }
    </script>
</body>
</html>
